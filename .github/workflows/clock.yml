# The cloud clock (docs/plans/cloud-clock): IN1 every minute in the NSE session and the slim cycle
# (square-off, fund pass, coverage), on the paper ledger sealed in the `ledger-state` release.
# Paper only: no broker, no real order.
#
# Inert until the repository variable CLOUD_WRITER is "true" (set it after `node scripts/ledger.mjs
# cutover`). Needs the repository secret LEDGER_KEY.
#
# Cron is best-effort on GitHub, and this repository's crons start 2-2.6 h late (2026-10-24..26: the
# 08:13 run had not begun at 09:11), so the morning starters begin at 03:43 IST and a run from 03:30
# already belongs to the session (lib/ledger/schedule.ts). One group, never cancelled: a run started
# while another loops waits and continues after it. A session run loops for at most 5 h 25 min (the
# job limit is 6 h), an early one until 09:10, then queues its own successor with this workflow's
# token (workflow_dispatch), so the session never waits on a late cron; the afternoon crons are only a
# fallback. Outside the session the slim cycle runs once. Times are UTC: IST = UTC + 5:30.
name: Clock

on:
  schedule:
    - cron: "13 22 * * 0-4"  # 03:43 IST Mon-Fri (still the previous day in UTC): the morning starters
    - cron: "43 22 * * 0-4"  # 04:13 IST
    - cron: "13 23 * * 0-4"  # 04:43 IST
    - cron: "43 23 * * 0-4"  # 05:13 IST
    - cron: "13 0 * * 1-5"   # 05:43 IST
    - cron: "43 0 * * 1-5"   # 06:13 IST
    - cron: "13 1 * * 1-5"   # 06:43 IST
    - cron: "43 2 * * 1-5"   # 08:13 IST
    - cron: "3 3 * * 1-5"    # 08:33 IST
    - cron: "19 3 * * 1-5"   # 08:49 IST
    - cron: "47 6 * * 1-5"   # 12:17 IST: a fallback, only if a hand-over's dispatch failed
    - cron: "47 7 * * 1-5"   # 13:17 IST
    - cron: "17 9 * * 1-5"   # 14:47 IST: the same, then the after-close cycle (coverage)
    - cron: "37 9 * * 1-5"   # 15:07 IST
    - cron: "29 */3 * * *"   # every 3 hours, every day: the crypto mandates and the off-hours fund pass
  workflow_dispatch:
    inputs: # set by a run that hands the session on; leave them empty when starting by hand
      chain:
        description: "Hand-overs before this run today (capped; see lib/ledger/schedule.ts)"
        default: "0"
      from_run:
        description: "The run that queued this one"
        default: ""

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  clock:
    if: vars.CLOUD_WRITER == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write # the release assets that hold the sealed ledger
      actions: write # queue the next Clock run at a hand-over (workflow_dispatch)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the write token reaches only the clock step, never npm's install scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the laptop's runtime
      # node_modules from the lockfile: the hand-over between two runs is mostly set-up time, and
      # every second of it is a minute IN1 may not run. Holds packages only, no secret.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Run the clock
        env:
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOCK_CHAIN: ${{ inputs.chain || '0' }} # empty on a cron start
          CLOCK_FROM_RUN: ${{ inputs.from_run || '' }}
        run: node scripts/clock.mjs run
